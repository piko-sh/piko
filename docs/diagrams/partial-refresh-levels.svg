<svg viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="prl-title prl-desc">
  <title id="prl-title">The four piko.partials.reload modes and what survives a reload</title>
  <desc id="prl-desc">Four columns, one per reload mode, show the call-site option and what is preserved or refreshed when piko.partials.reload runs. Merge is the default and overwrites server-emitted root attributes while preserving live-only ones; children are morphed. Replace also clears live-only root attributes. Children-only leaves root attributes alone and only morphs children. Attrs-only refreshes root attributes and leaves children alone. Across every mode the partial's host DOM node identity is preserved so listeners, refs, and component state survive.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>


  <rect x="20" y="14" width="600" height="34" rx="8" fill="#1C544F"/>
  <text x="320" y="30" text-anchor="middle" fill="#FFEE9C" font-family="system-ui, sans-serif" font-size="11" font-weight="600">piko.partials.reload(name, options)</text>
  <text x="320" y="44" text-anchor="middle" fill="#A7F0E9" font-family="monospace" font-size="10">DOM morph, host node identity preserved</text>

  <line x1="320" y1="50" x2="320" y2="68" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round" marker-end="url(#arrow)"/>


  <rect x="20" y="74" width="146" height="200" rx="10" fill="#236962" stroke="#6BD5CC" stroke-width="1.5"/>
  <path d="M30,74 H156 A10,10 0 0 1 166,84 V96 H20 V84 A10,10 0 0 1 30,74 Z" fill="#1C544F"/>
  <text x="93" y="89" text-anchor="middle" fill="#6BD5CC" font-family="system-ui, sans-serif" font-size="10" font-weight="600">merge (default)</text>
  <text x="93" y="113" text-anchor="middle" fill="#A7F0E9" font-family="monospace" font-size="9">no option</text>

  <text x="32" y="138" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ server attrs win</text>
  <text x="32" y="156" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ live-only attrs kept</text>
  <text x="32" y="174" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ children morph</text>
  <text x="32" y="192" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ scope chain kept</text>
  <text x="32" y="222" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">use for the common</text>
  <text x="32" y="234" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">case: server has</text>
  <text x="32" y="246" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">opinions on its attrs</text>


  <rect x="174" y="74" width="146" height="200" rx="10" fill="#2B333B" stroke="#485461" stroke-width="1.2"/>
  <path d="M184,74 H310 A10,10 0 0 1 320,84 V96 H174 V84 A10,10 0 0 1 184,74 Z" fill="#364049"/>
  <text x="247" y="89" text-anchor="middle" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">replace</text>
  <text x="247" y="113" text-anchor="middle" fill="#A7F0E9" font-family="monospace" font-size="9">mode: 'replace'</text>

  <text x="186" y="138" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ server attrs win</text>
  <text x="186" y="156" fill="#ff5f57" font-family="system-ui, sans-serif" font-size="10">- live-only attrs gone</text>
  <text x="186" y="174" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ children morph</text>
  <text x="186" y="192" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ scope chain kept</text>
  <text x="186" y="222" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">use when server is</text>
  <text x="186" y="234" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">fully authoritative</text>
  <text x="186" y="246" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">for root attrs</text>


  <rect x="328" y="74" width="146" height="200" rx="10" fill="#2B333B" stroke="#485461" stroke-width="1.2"/>
  <path d="M338,74 H464 A10,10 0 0 1 474,84 V96 H328 V84 A10,10 0 0 1 338,74 Z" fill="#364049"/>
  <text x="401" y="89" text-anchor="middle" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">children-only</text>
  <text x="401" y="113" text-anchor="middle" fill="#A7F0E9" font-family="monospace" font-size="9">mode: 'children-only'</text>

  <text x="340" y="138" fill="#ff5f57" font-family="system-ui, sans-serif" font-size="10">- no root attr work</text>
  <text x="340" y="156" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ all live attrs kept</text>
  <text x="340" y="174" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ children morph</text>
  <text x="340" y="192" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ scope chain kept</text>
  <text x="340" y="222" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">use when the root</text>
  <text x="340" y="234" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">is a stable mount</text>
  <text x="340" y="246" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">point only</text>


  <rect x="482" y="74" width="138" height="200" rx="10" fill="#2B333B" stroke="#485461" stroke-width="1.2"/>
  <path d="M492,74 H610 A10,10 0 0 1 620,84 V96 H482 V84 A10,10 0 0 1 492,74 Z" fill="#364049"/>
  <text x="551" y="89" text-anchor="middle" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">attrs-only</text>
  <text x="551" y="113" text-anchor="middle" fill="#A7F0E9" font-family="monospace" font-size="9">mode: 'attrs-only'</text>

  <text x="494" y="138" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ server attrs win</text>
  <text x="494" y="156" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ live-only attrs kept</text>
  <text x="494" y="174" fill="#ff5f57" font-family="system-ui, sans-serif" font-size="10">- children untouched</text>
  <text x="494" y="192" fill="#28c840" font-family="system-ui, sans-serif" font-size="10">+ scope chain kept</text>
  <text x="494" y="222" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">use for badges or</text>
  <text x="494" y="234" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">polled headers that</text>
  <text x="494" y="246" fill="#92A1AF" font-family="system-ui, sans-serif" font-size="9">change only attrs</text>


  <rect x="20" y="288" width="600" height="58" rx="8" fill="#2B333B" stroke="#485461" stroke-width="1.2"/>
  <text x="32" y="306" fill="#FFEE9C" font-family="system-ui, sans-serif" font-size="10" font-weight="600">extra control (every mode)</text>
  <text x="32" y="324" fill="#C9F5F2" font-family="monospace" font-size="10">ownedAttrs: ['a','b']   - only sync listed attrs at the root</text>
  <text x="32" y="338" fill="#C9F5F2" font-family="monospace" font-size="10">preserveAttrs: ['a']    - never touch listed attrs at the root</text>
</svg>
